name: Build exe
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name SlideGrabber app.py
      - uses: actions/upload-artifact@v4
        with:
          name: SlideGrabber
          path: dist/SlideGrabber.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-exe
          name: SlideGrabber (последняя сборка)
          files: dist/SlideGrabber.exe
